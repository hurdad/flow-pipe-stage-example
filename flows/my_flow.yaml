queues:
  - name: q_in
    capacity: 256

  - name: q_out
    capacity: 256

stages:
  - name: source
    type: noop_source
    threads: 1
    output_queue: q_in
    config:
      delay_ms: 100
      message: "uppercase test"
      max_messages: 20

  - name: uppercase
    type: uppercase_transform
    threads: 1
    input_queue: q_in
    output_queue: q_out
    config:
      verbose: false

  - name: sink
    type: stdout_sink
    threads: 1
    input_queue: q_out
